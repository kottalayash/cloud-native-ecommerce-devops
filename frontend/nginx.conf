server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/products {
        proxy_pass http://product-service:3001/products;
        proxy_http_version 1.1;
    }

    location /api/orders {
        proxy_pass http://order-service:3002/orders;
        proxy_http_version 1.1;
    }
}
