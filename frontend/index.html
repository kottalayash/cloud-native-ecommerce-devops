<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudShop | DevOps Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">AWS EKS • Kubernetes • CI/CD</p>
      <h1>CloudShop</h1>
      <p>Cloud-native e-commerce application built for a real DevOps deployment.</p>
    </div>
  </header>

  <main class="container">
    <section>
      <div class="section-title">
        <h2>Products</h2>
        <span id="health" class="status">Checking services...</span>
      </div>
      <div id="products" class="grid">
        <p>Loading products...</p>
      </div>
    </section>

    <section class="card">
      <h2>Place an Order</h2>
      <form id="orderForm">
        <label>
          Product
          <select id="product" required></select>
        </label>
        <label>
          Quantity
          <input id="quantity" type="number" min="1" value="1" required>
        </label>
        <button type="submit">Place Order</button>
      </form>
      <p id="message"></p>
    </section>
  </main>

  <footer>
    <p>Cloud-Native E-Commerce DevOps Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
