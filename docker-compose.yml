services:
  product-service:
    build: ./product-service
    container_name: product-service
    networks: [app-network]

  order-service:
    build: ./order-service
    container_name: order-service
    networks: [app-network]

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - product-service
      - order-service
    networks: [app-network]

networks:
  app-network:
    driver: bridge
